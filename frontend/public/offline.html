<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Band Planner — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d0d10;
      --bg2:    #18181c;
      --accent: #f0522a;
      --text:   #f0f0f4;
      --text3:  #5a5a72;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 0;
    }

    /* Animated signal bars */
    .signal {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 48px;
      margin-bottom: 40px;
    }

    .signal-bar {
      width: 10px;
      border-radius: 3px 3px 0 0;
      background: var(--bg2);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .signal-bar:nth-child(1) { height: 16px; animation-delay: 0s; }
    .signal-bar:nth-child(2) { height: 26px; animation-delay: 0.2s; }
    .signal-bar:nth-child(3) { height: 36px; animation-delay: 0.4s; }
    .signal-bar:nth-child(4) { height: 48px; animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { background: var(--bg2); }
      50%       { background: var(--accent); }
    }

    .title {
      font-family: 'Bebas Neue', monospace;
      font-size: 52px;
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
    }

    .message {
      font-size: 13px;
      color: var(--text3);
      line-height: 1.7;
      max-width: 300px;
      margin-bottom: 48px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 32px;
    }

    .cached-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text3);
      margin-bottom: 16px;
    }

    .cached-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 260px;
    }

    .cached-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .cached-link:active {
      border-color: var(--accent);
    }

    .cl-icon { font-size: 16px; }
    .cl-label { flex: 1; text-align: left; }
    .cl-arrow { color: var(--text3); font-size: 11px; }

    .retry-btn {
      margin-top: 40px;
      padding: 14px 32px;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Bebas Neue', monospace;
      font-size: 18px;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 0;
      position: relative;
      overflow: hidden;
      transition: color 0.25s;
    }

    .retry-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .retry-btn:active::before { transform: translateX(0); }
    .retry-btn:active { color: var(--bg); }

    .retry-btn span { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="page">
    <div class="signal">
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
    </div>

    <div class="title">No Signal</div>
    <div class="subtitle">You're offline</div>

    <p class="message">
      Check your connection.<br />
      Cached pages are still available below.
    </p>

    <div class="divider"></div>

    <div class="cached-label">Available offline</div>
    <div class="cached-links">
      <a href="/gigs" class="cached-link">
        <span class="cl-icon">🎸</span>
        <span class="cl-label">Gigs</span>
        <span class="cl-arrow">→</span>
      </a>
      <a href="/tours" class="cached-link">
        <span class="cl-icon">🗺</span>
        <span class="cl-label">Tours</span>
        <span class="cl-arrow">→</span>
      </a>
      <a href="/calendar" class="cached-link">
        <span class="cl-icon">📅</span>
        <span class="cl-label">Calendar</span>
        <span class="cl-arrow">→</span>
      </a>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      <span>Try Again</span>
    </button>
  </div>
</body>
</html>
