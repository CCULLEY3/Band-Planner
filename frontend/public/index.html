<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- ── Viewport ── -->
  <!-- viewport-fit=cover extends content behind iPhone notch / Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ── PWA / Install ── -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0d0d10" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- ── iOS Safari specific ── -->
  <!-- Enables "Add to Home Screen" as a standalone app (no browser chrome) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Band Planner" />

  <!-- iOS splash screens (covers all modern iPhone/iPad sizes) -->
  <!-- iPhone 15 Pro Max / 14 Pro Max -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
        href="/splash/splash-1290x2796.png" />
  <!-- iPhone 15 Pro / 14 Pro -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
        href="/splash/splash-1179x2556.png" />
  <!-- iPhone 15 / 14 / 13 -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
        href="/splash/splash-1170x2532.png" />
  <!-- iPhone SE 3rd gen -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
        href="/splash/splash-750x1334.png" />
  <!-- iPad Pro 12.9" -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
        href="/splash/splash-2048x2732.png" />

  <!-- iOS touch icon (used on home screen; no rounded corners applied — iOS does it) -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />

  <!-- ── Android / standard favicons ── -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- ── SEO / Social ── -->
  <title>Band Planner</title>
  <meta name="description" content="Manage gigs, plan tours, track finances, and coordinate your crew." />
  <meta name="application-name" content="Band Planner" />
  <meta name="author" content="Band Planner" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Band Planner" />
  <meta property="og:description" content="Manage gigs, plan tours, track finances, and coordinate your crew." />
  <meta property="og:image" content="/icons/icon-512.png" />

  <!-- Prevent phone number detection on iOS -->
  <meta name="format-detection" content="telephone=no" />

  <!-- ── Safe area CSS variables (used in index.css) ── -->
  <style>
    /* Fill behind notch/home indicator on iOS using env() variables */
    :root {
      --sat: env(safe-area-inset-top,    0px);
      --sar: env(safe-area-inset-right,  0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left,   0px);
    }
  </style>
</head>
<body>
  <noscript>Band Planner requires JavaScript.</noscript>
  <div id="root"></div>
</body>
</html>
